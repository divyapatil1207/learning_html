<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            table format
        </title>
        
    </head>
    <body>
        <h3>Subject Details</h3>
        <table border="2">
            <thead>
                <tr>
                    <th>Language</th>
                    <th>Details</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td rowspan= "3">Web Design</td>
                    <td>HTML</td>
                </tr>
                <tr>
                    <td>CSS</td>
                </tr>
                <tr>
                    <td>Javascript</td>
                </tr>
                <tr>
                    <td rowspan= "4">Graphic Design</td>
                    <td>Adobe photoshop</td>
                </tr>
                <tr>
                    <td>Figma</td>
                </tr>
                <tr>
                    <td>Canva</td>
                </tr>
                <tr>
                    <td>Illustration</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
